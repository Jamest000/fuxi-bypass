name: Build fuxi_unblank_bypass.ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev make python3 zip cpio pahole

      - name: Download Android Clang r450784e (14.0.7)
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang_repo
          cd clang_repo && git sparse-checkout set clang-r450784e
          echo "$PWD/clang-r450784e/bin" >> $GITHUB_PATH

      - name: Fetch AOSP GKI kernel commit b00609b259a5
        run: |
          git clone --filter=blob:none --no-checkout https://android.googlesource.com/kernel/common kernel
          cd kernel
          git checkout b00609b259a5

      - name: Prepare kernel config and symbol CRCs
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config --disable LOCALVERSION_AUTO --disable TRIM_UNUSED_KSYMS --disable LTO_CLANG_FULL --enable LTO_CLANG_THIN --set-str LOCALVERSION "-android13-8-gb00609b259a5"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 vmlinux modules_prepare
          cp -f vmlinux.symvers Module.symvers

      - name: Build fuxi_unblank_bypass.ko & package KernelSU ZIP
        run: |
          make KDIR=$PWD/kernel
          modinfo fuxi_unblank_bypass.ko
          mkdir -p ksu_module
          cp -f fuxi_unblank_bypass.ko service.sh module.prop ksu_module/
          chmod 0755 ksu_module/service.sh
          cd ksu_module && zip -r ../fuxi_bq_bypass_v2.zip .

      - name: Upload compiled module & KernelSU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fuxi_unblank_bypass_release
          path: |
            fuxi_unblank_bypass.ko
            fuxi_bq_bypass_v2.zip
