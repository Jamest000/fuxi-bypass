name: Build fuxi_unblank_bypass.ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev make python3 zip git curl tar
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || true
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5 || true

      - name: Fetch exact Google Clang r450784e (14.0.7)
        run: |
          mkdir -p clang-prebuilt/clang-r450784e
          REFS="refs/heads/android13-gsi refs/heads/android13-security-release refs/tags/android-13.0.0_r74 refs/tags/android-13.0.0_r41 refs/tags/android-13.0.0_r1"
          for ref in $REFS; do
            if curl -fsSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${ref}/clang-r450784e.tar.gz" -o clang.tar.gz; then
              tar -xzf clang.tar.gz -C clang-prebuilt/clang-r450784e
              rm -f clang.tar.gz
              if [ -x clang-prebuilt/clang-r450784e/bin/clang ]; then
                echo "Downloaded clang-r450784e from $ref"
                break
              fi
            fi
          done
          test -x clang-prebuilt/clang-r450784e/bin/clang
          clang-prebuilt/clang-r450784e/bin/clang --version

      - name: Fetch AOSP GKI android13-5.15 branch
        run: |
          git clone --depth=1 -b android13-5.15 https://android.googlesource.com/kernel/common kernel

      - name: Prepare kernel config and KMI symbol CRCs
        run: |
          export PATH="$PWD/clang-prebuilt/clang-r450784e/bin:$PATH"
          cd kernel
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 178/' Makefile
          touch .scmversion
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config --disable LOCALVERSION_AUTO --enable MODVERSIONS --enable LTO_CLANG_THIN --enable CFI_CLANG --disable CFI_PERMISSIVE --disable DEBUG_INFO_BTF --disable MODULE_SIG --disable MODULE_SIG_ALL --disable WERROR --set-str LOCALVERSION "-android13-8-gb00609b259a5"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" vmlinux modules_prepare
          cp -f vmlinux.symvers Module.symvers

      - name: Build fuxi_unblank_bypass.ko & package KernelSU ZIP
        run: |
          export PATH="$PWD/clang-prebuilt/clang-r450784e/bin:$PATH"
          make -C kernel M=$PWD ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" modules
          modinfo fuxi_unblank_bypass.ko
          mkdir -p ksu_module
          cp -f fuxi_unblank_bypass.ko service.sh module.prop ksu_module/
          sed -i 's#insmod "$MODDIR/fuxi_unblank_bypass.ko" 2>/dev/null#insmod "$MODDIR/fuxi_unblank_bypass.ko" 2>/dev/null || /data/adb/ksu/bin/busybox insmod "$MODDIR/fuxi_unblank_bypass.ko" 2>/dev/null#' ksu_module/service.sh
          chmod 0755 ksu_module/service.sh
          cd ksu_module && zip -r ../fuxi_bq_bypass_v2.zip .

      - name: Upload compiled module & KernelSU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fuxi_unblank_bypass_release
          path: |
            fuxi_unblank_bypass.ko
            fuxi_bq_bypass_v2.zip
